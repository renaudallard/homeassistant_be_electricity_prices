name: Bug report
description: Report a problem with the integration
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report. Please fill in every section
        you can - missing supplier / DSO / contract / version info is the
        most common reason a bug takes weeks instead of hours to fix.

  - type: dropdown
    id: category
    attributes:
      label: What is the issue about?
      description: Helps route the report to the right area of the code.
      options:
        - Wrong price (current_price / today / tomorrow)
        - Tomorrow's prices not showing
        - current_year_cost wrong
        - Capacity peak / capacity_cost wrong
        - Injection price wrong
        - Setup or options flow
        - Stale data or repair issue
        - Other
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.5.1
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Settings -> Devices & Services -> be_electricity_prices -> three-dot menu -> "Download diagnostics" shows it under `manifest.version`.
      placeholder: e.g. 0.5.44
    validations:
      required: true

  - type: input
    id: when_started
    attributes:
      label: When did it start?
      description: First version it broke under, or a date / event ("after upgrading to 0.5.49", "first time I noticed today"). Half of "broken" reports correlate with a recent supplier card change; a date narrows it.
      placeholder: e.g. since 0.5.48, or "today around 14:00"

  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - HACS
        - Manual copy into custom_components
        - Other
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Flanders
        - Wallonia
        - Brussels
    validations:
      required: true

  - type: dropdown
    id: dso
    attributes:
      label: DSO
      options:
        - Fluvius Antwerpen
        - Fluvius Halle-Vilvoorde
        - Fluvius Imewo
        - Fluvius Midden-Vlaanderen (Intergem)
        - Fluvius Kempen (Iveka)
        - Fluvius Limburg
        - Fluvius West
        - Fluvius Zenne-Dijle
        - AIEG
        - AIESH
        - ORES
        - RESA
        - Regie de Wavre
        - Sibelga
    validations:
      required: true

  - type: dropdown
    id: dso_mode
    attributes:
      label: DSO tariff mode (Wallonia only)
      description: Bi-horaire is the default day/night CWaPE split; Impact is the CWaPE 3-band (PIC / MEDIUM / ECO) hour-of-day grid. Leave blank for Flanders / Brussels.
      options:
        - Bi-horaire
        - Impact (3-band)
        - Not applicable / not sure

  - type: dropdown
    id: supplier
    attributes:
      label: Supplier
      options:
        - Eneco
        - Engie
        - TotalEnergies
        - Luminus
        - Mega
        - Bolt
        - Cociter
        - DATS 24
        - EBEM
        - Ecofix
        - Ecopower
        - energie.be
        - Energy Knights
        - EnergyVision
        - Frank Energie
        - OCTA+
        - "Expert: custom formula (no public card)"
    validations:
      required: true

  - type: input
    id: contract
    attributes:
      label: Contract / tariff card name
      description: Exact name as shown in the integration's options (e.g. "Easy Indexed", "Dynamic", "Fix 1 jaar").
    validations:
      required: true

  - type: input
    id: contract_start
    attributes:
      label: Contract start date
      description: The date set on the integration's contract start option, if you set one. It prices the contract off the card published that month instead of the current one, so it is the first thing to check on a wrong price.
      placeholder: e.g. 2026-06-01, or "not set"

  - type: dropdown
    id: meter
    attributes:
      label: Meter type
      options:
        - Mono-horaire (single rate)
        - Bi-horaire (peak / off-peak)
        - Dynamic (smart meter, hourly or quarter-hourly)
        - Exclusive night
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: solar_regime
    attributes:
      label: Solar regime
      description: Required for any prosumer / injection / capacity bug. "Compensation" is the Walloon pre-2024 net-meter regime; "Injection" is the post-2024 (and Flemish digital-meter) per-kWh credit.
      options:
        - None (no solar)
        - Compensation
        - Injection
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you observed, including any incorrect values (price, capacity cost, peak, injection, etc.).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Enable debug logging in `configuration.yaml`, reload the
        integration, then paste the lines from `home-assistant.log`
        that mention `be_electricity_prices`.

        ```yaml
        logger:
          default: warning
          logs:
            custom_components.be_electricity_prices: debug
        ```
      render: shell

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics download (optional but very helpful)
      description: Settings -> Devices & Services -> be_electricity_prices -> three-dot menu -> "Download diagnostics", then drag the JSON file into this box.
