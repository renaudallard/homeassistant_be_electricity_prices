name: Archive tariff cards

on:
  schedule:
    # 05:41 UTC = 06:41 CET / 07:41 CEST, after the suppliers' overnight
    # publication and before the 06:17 live check. Off the hour for the
    # reason live_check.yml spells out: the top of the hour is where GitHub
    # sheds scheduled runs first.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      backfill_months:
        description: >-
          Also mirror this many closed months before the current one from the
          supplier archives, for months the branch does not hold yet.
        default: "0"
        required: false
        type: string
      reparse:
        description: Replay every stored month through the parser even if it did not change.
        default: false
        required: false
        type: boolean
      rerender:
        description: Replay every stored month with its PDFs rendered afresh, for a PDF reader upgrade.
        default: false
        required: false
        type: boolean

# The job pushes to the archive branch, and nothing else does; issues so a
# failed run is filed rather than left on the Actions tab.
permissions:
  contents: write
  issues: write

# A manual run overlapping the schedule would push the same day's cards
# twice and the second push would be rejected as non-fast-forward. Queue
# it instead of cancelling: both runs are worth finishing.
concurrency:
  group: archive-cards
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # A full walk is about 250 cards, 21 minutes on a Raspberry Pi; a parse
    # that never returns is bounded per card by the script. A backfill asks
    # one archived card per supplier, contract, region and month on top,
    # so a dispatch that asks for one gets six hours.
    timeout-minutes: ${{ ((github.event.inputs.backfill_months != '' && github.event.inputs.backfill_months != '0') || github.event.inputs.rerender == 'true') && 360 || 60 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The script imports the integration package itself (for the
          # snapshot codec the Store uses), so it needs what the package
          # imports at module level: homeassistant, defusedxml for api.py
          # and the two PDF readers. Versions come from requirements-dev.txt
          # so this runs against what the test suite proved.
          # freezegun pins the clock to a row's capture day while a stored
          # month is replayed through the current parser.
          pip install -c requirements-dev.txt \
            pypdf pdfplumber aiohttp defusedxml homeassistant freezegun

      - name: Check out the archive branch
        # The archive lives on its own branch so three years of daily
        # commits stay out of main's history and out of every HACS
        # download. Checked out as a worktree under tmp/, which main's
        # .gitignore covers. The first run creates the branch unborn.
        run: |
          if git fetch --depth=1 origin archive; then
            git worktree add --detach tmp/archive FETCH_HEAD
            git -C tmp/archive checkout -B archive
          else
            git worktree add --orphan -b archive tmp/archive
          fi

      - name: Store today's cards
        id: store
        env:
          CARDS_REPO: renaudallard/be_price_cards
        run: >-
          python scripts/archive_cards.py --out tmp/archive --pdfs tmp/pdfs
          --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download"
          --archive-base-url "${{ github.server_url }}/${{ github.repository }}/blob/archive"
          --backfill "${{ github.event.inputs.backfill_months || '0' }}"
          ${{ github.event.inputs.reparse == 'true' && '--reparse' || '' }}
          ${{ github.event.inputs.rerender == 'true' && '--rerender' || '' }}

      - name: Keep the cards themselves
        id: keep
        # The PDFs go to the releases of be_price_cards, a repository shared
        # with be_water_prices: this integration's releases are named
        # electricity-<YYYY-MM> after the month the cards are for, the
        # files by their SHA-256. A month of cards is about 100 MB, which no
        # git branch of this repository should carry and which HACS would
        # mistake for a release if it lived here. GitHub caps a release at a
        # thousand assets, five times what a month holds; should a month
        # ever overflow it spills into electricity-YYYY-MM-2, and the
        # manifest on the branch says which release holds each file. Needs a
        # fine-grained token with contents read and write on that repository
        # in the BE_ELECTRICITY_CARDS secret; without it the step says so and
        # the branch still gets the parsed cards and their texts.
        env:
          GH_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
          CARDS_REPO: renaudallard/be_price_cards
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "BE_ELECTRICITY_CARDS is not set: today's PDFs are not kept" >&2
            exit 0
          fi
          # A release needs a commit to tag, and a repository created empty
          # has none: give it a first one, once.
          cards_url="https://x-access-token:${GH_TOKEN}@github.com/${CARDS_REPO}.git"
          if [ -z "$(git ls-remote --heads "$cards_url" 2>/dev/null)" ]; then
            seed=$(mktemp -d)
            printf '%s\n' \
              "# Price cards" \
              "" \
              "The original tariff cards the Belgian price integrations refer to, kept as" \
              "release assets named by their SHA-256, one namespace per integration." \
              "Nothing here is edited by hand." \
              > "$seed/README.md"
            git -C "$seed" init -q -b main
            git -C "$seed" add README.md
            git -C "$seed" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Start the card store"
            git -C "$seed" push -q "$cards_url" main
          fi
          manifest=tmp/archive/pdfs.json
          [ -s "$manifest" ] || echo '{}' > "$manifest"
          ensure_release() {
            gh release view "$1" --repo "$CARDS_REPO" >/dev/null 2>&1 && return 0
            gh release create "$1" --repo "$CARDS_REPO" --title "Electricity cards $2" --notes "The PDF tariff cards for $2 that the archive branch of homeassistant_be_electricity_prices refers to, each named by its SHA-256. Which card each file is: search for the file name in https://github.com/${CARDS_REPO}/blob/main/electricity/coverage.md, which links every contract and month to its card and to what was parsed out of it."
          }
          for dir in tmp/pdfs/electricity-*/; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            month=${base#electricity-}
            # Every release of this month that exists (normally one; a
            # month never nears the cap): which file is where, and how full
            # the last one is.
            : > have.txt
            n=1; tag=$base; count=0
            while gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq ".assets[].name | \"\(.) $tag\"" >> have.txt 2>/dev/null; do
              count=$(gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq '.assets | length')
              next="$base-$((n + 1))"
              gh release view "$next" --repo "$CARDS_REPO" >/dev/null 2>&1 || break
              n=$((n + 1)); tag=$next
            done
            ensure_release "$tag" "$month"
            # Where each file landed, merged into the manifest once per
            # month rather than once per file: a backfill day uploads a
            # thousand files, and rewriting the whole manifest for each
            # took longer than some of the uploads.
            : > landed.txt
            for pdf in "$dir"*.pdf; do
              name=$(basename "$pdf")
              where=$(awk -v f="$name" '$1 == f {print $2; exit}' have.txt)
              if [ -z "$where" ]; then
                if [ "$count" -ge 1000 ]; then
                  n=$((n + 1)); tag="$base-$n"; count=0
                  ensure_release "$tag" "$month"
                fi
                gh release upload "$tag" "$pdf" --repo "$CARDS_REPO"
                count=$((count + 1))
                where=$tag
              fi
              echo "${name%.pdf} $where/$name" >> landed.txt
            done
            if [ -s landed.txt ]; then
              jq -Rn '[inputs | split(" ") | {(.[0]): .[1]}] | add // {}' landed.txt > landed.json
              jq -s '.[0] + .[1]' "$manifest" landed.json > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
            fi
          done
          # Same retention as the branch: a month older than three years goes.
          # Only this integration's releases; the water ones are not ours.
          cutoff="electricity-$(date -u -d '-36 months' +%Y-%m)"
          gh release list --repo "$CARDS_REPO" --json tagName --jq '.[].tagName'             | while read -r tag; do
              case "$tag" in electricity-*) ;; *) continue ;; esac
              if [ "$tag" \< "$cutoff" ]; then
                gh release delete "$tag" --repo "$CARDS_REPO" --yes --cleanup-tag
              fi
            done

      - name: Index the kept cards for people
        # The walk wrote coverage.md before today's uploads were in the
        # manifest; rewrite it now so every month links to a file that
        # exists. No fetch, a second or two.
        env:
          CARDS_REPO: renaudallard/be_price_cards
        run: >-
          python scripts/archive_cards.py --out tmp/archive --index-only
          --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download"
          --archive-base-url "${{ github.server_url }}/${{ github.repository }}/blob/archive"

      - name: Publish the listings in the cards repository
        # The releases name files by digest; the listing that names the
        # cards lives beside them, under this integration's own directory
        # of the shared repository, so a person on the releases page is one
        # click from the names. A commit only when the listing changed.
        env:
          CARDS_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
          CARDS_REPO: renaudallard/be_price_cards
        run: |
          [ -n "$CARDS_TOKEN" ] || exit 0
          cards_url="https://x-access-token:${CARDS_TOKEN}@github.com/${CARDS_REPO}.git"
          git clone -q --depth=1 "$cards_url" tmp/cards
          mkdir -p tmp/cards/electricity
          printf '%s\n' \
            "# Price cards" \
            "" \
            "The original tariff cards the Belgian price integrations refer to, kept as" \
            "release assets named by their SHA-256, one namespace per integration:" \
            "" \
            "- \`electricity/\`: homeassistant_be_electricity_prices, releases \`electricity-<YYYY-MM>\`." \
            "- \`water/\`: be_water_prices, releases \`water-<YYYY-MM>\`." \
            "" \
            "Each directory holds the listings that name the files: which contract and month" \
            "a card is, and where to download it. Nothing here is edited by hand." \
            > tmp/cards/README.md
          printf '%s\n' \
            "# Electricity cards" \
            "" \
            "The tariff cards homeassistant_be_electricity_prices parsed, kept as the assets of" \
            "the \`electricity-<YYYY-MM>\` releases of this repository and named by their SHA-256." \
            "" \
            "- \`coverage.md\`: per contract and region, the months held, each linking to its card" \
            "  (or to the page it was read from) and to the card as the integration parsed it." \
            "" \
            "The parsed cards themselves are the \`archive\` branch of" \
            "https://github.com/renaudallard/homeassistant_be_electricity_prices." \
            > tmp/cards/electricity/README.md
          cp tmp/archive/coverage.md tmp/cards/electricity/
          rm -f tmp/cards/electricity/pdfs.md
          cd tmp/cards
          git add -A
          if git diff --cached --quiet; then
            echo "listings unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Electricity listings of $(date -u +%Y-%m-%d)"
          git push -q origin HEAD:main

      - name: Warn before the upload token expires
        # A fine-grained token lives a year at most, and the first sign of
        # its expiry would otherwise be the failure issue on the morning
        # after. GitHub reports a fine-grained token's expiry in a response
        # header, so ask, and file an issue while there are still two weeks
        # to make a new one and update the secret. Runs even when an earlier
        # step failed: the warning is worth having either way.
        if: always()
        env:
          CARDS_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CARDS_TOKEN" ] || exit 0
          expires=$(GH_TOKEN=$CARDS_TOKEN gh api -i /user 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1) == "github-authentication-token-expiration" {print $2}')
          if [ -z "$expires" ]; then
            echo "the upload token reports no expiry"
            exit 0
          fi
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u +%s) ) / 86400 ))
          echo "the upload token expires on $expires ($left days left)"
          [ "$left" -le 14 ] || exit 0
          {
            echo "## The upload token expires on $expires"
            echo
            echo "$left day(s) left. Create a new fine-grained token with contents read and"
            echo "write on the cards repository and store it as the BE_ELECTRICITY_CARDS"
            echo "secret; until then the PDFs of each day are offered again by the next run"
            echo "that has a working token."
          } > token_body.md
          echo "token expires $expires" > token_fingerprint.txt
          bash scripts/file_ci_issue.sh \
            --label archive-cards \
            --title "[archive-cards] the upload token expires soon" \
            --body token_body.md \
            --fingerprint token_fingerprint.txt \
            --workflow .github/workflows/archive_cards.yml

      - name: Commit and push what changed
        id: push
        run: |
          cd tmp/archive
          git add -A
          if git diff --cached --quiet; then
            echo "no card changed today"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Cards seen on $(date -u +%Y-%m-%d)"
          git push origin archive

      - name: File the failure as an issue
        # Nobody watches the Actions tab. A run that stored nothing, a push
        # that was refused or an upload token that has expired (fine-grained
        # tokens live a year at most) would otherwise end the archive quietly.
        # Same label-deduplicated shape as the live check's issues: one open
        # issue per problem, a comment per further failing run, and it says
        # which step failed so the token case is told from the others.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label='archive-cards'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed=''
          [ "${{ steps.store.outcome }}" = 'failure' ] && failed='Store today'"'"'s cards (the walk stored nothing, or crashed)'
          [ "${{ steps.keep.outcome }}" = 'failure' ] && failed='Keep the cards themselves (the upload to the cards repository; check the BE_ELECTRICITY_CARDS token, it expires)'
          [ "${{ steps.push.outcome }}" = 'failure' ] && failed='Commit and push what changed (the push to the archive branch)'
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            echo "## Failed step"
            echo
            echo "${failed:-an earlier step; see the run}"
          } > issue_body.md
          # The failed step is the fingerprint: the same step failing again
          # within the week adds nothing, a different one is posted at once.
          echo "${failed:-unknown}" > failed_step.txt
          bash scripts/file_ci_issue.sh \
            --label "$label" \
            --title "[archive-cards] the card archive run failed" \
            --body issue_body.md \
            --fingerprint failed_step.txt \
            --workflow .github/workflows/archive_cards.yml
