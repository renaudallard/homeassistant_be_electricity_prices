name: Archive tariff cards

on:
  schedule:
    # 05:41 UTC = 06:41 CET / 07:41 CEST, after the suppliers' overnight
    # publication and before the 06:17 live check. Off the hour for the
    # reason live_check.yml spells out: the top of the hour is where GitHub
    # sheds scheduled runs first.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      backfill_months:
        description: >-
          Also mirror this many closed months before the current one from the
          supplier archives, for months the branch does not hold yet.
        default: "0"
        required: false
        type: string
      reparse:
        description: Replay every stored month through the parser even if it did not change.
        default: false
        required: false
        type: boolean
      rerender:
        description: Replay every stored month with its PDFs rendered afresh, for a PDF reader upgrade.
        default: false
        required: false
        type: boolean

# The job pushes to the archive branch, and nothing else does.
permissions:
  contents: write

# A manual run overlapping the schedule would push the same day's cards
# twice and the second push would be rejected as non-fast-forward. Queue
# it instead of cancelling: both runs are worth finishing.
concurrency:
  group: archive-cards
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # A full walk is about 250 cards, 21 minutes on a Raspberry Pi; a parse
    # that never returns is bounded per card by the script. A backfill asks
    # one archived card per supplier, contract, region and month on top,
    # so a dispatch that asks for one gets six hours.
    timeout-minutes: ${{ ((github.event.inputs.backfill_months != '' && github.event.inputs.backfill_months != '0') || github.event.inputs.rerender == 'true') && 360 || 60 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The script imports the integration package itself (for the
          # snapshot codec the Store uses), so it needs what the package
          # imports at module level: homeassistant, defusedxml for api.py
          # and the two PDF readers. Versions come from requirements-dev.txt
          # so this runs against what the test suite proved.
          # freezegun pins the clock to a row's capture day while a stored
          # month is replayed through the current parser.
          pip install -c requirements-dev.txt \
            pypdf pdfplumber aiohttp defusedxml homeassistant freezegun

      - name: Check out the archive branch
        # The archive lives on its own branch so three years of daily
        # commits stay out of main's history and out of every HACS
        # download. Checked out as a worktree under tmp/, which main's
        # .gitignore covers. The first run creates the branch unborn.
        run: |
          if git fetch --depth=1 origin archive; then
            git worktree add --detach tmp/archive FETCH_HEAD
            git -C tmp/archive checkout -B archive
          else
            git worktree add --orphan -b archive tmp/archive
          fi

      - name: Store today's cards
        env:
          CARDS_REPO: renaudallard/homeassistant_be_electricity_prices_cards
        run: >-
          python scripts/archive_cards.py --out tmp/archive --pdfs tmp/pdfs
          --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download"
          --backfill "${{ github.event.inputs.backfill_months || '0' }}"
          ${{ github.event.inputs.reparse == 'true' && '--reparse' || '' }}
          ${{ github.event.inputs.rerender == 'true' && '--rerender' || '' }}

      - name: Keep the cards themselves
        # The PDFs go to a separate repository's releases, one per month,
        # named by their SHA-256: a month of cards is about 100 MB, which
        # no git branch of this repository should carry and which HACS
        # would mistake for a release if it lived here. Needs a fine-grained
        # token with contents read and write on that repository in the
        # CARDS_TOKEN secret; without it the step says so and the branch
        # still gets the parsed cards and their texts.
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN }}
          CARDS_REPO: renaudallard/homeassistant_be_electricity_prices_cards
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CARDS_TOKEN is not set: today's PDFs are not kept" >&2
            exit 0
          fi
          # A release needs a commit to tag, and a repository created empty
          # has none: give it a first one, once.
          cards_url="https://x-access-token:${GH_TOKEN}@github.com/${CARDS_REPO}.git"
          if [ -z "$(git ls-remote --heads "$cards_url" 2>/dev/null)" ]; then
            seed=$(mktemp -d)
            printf '%s\n' \
              "# Tariff cards" \
              "" \
              "The PDF tariff cards the archive branch of homeassistant_be_electricity_prices" \
              "refers to, one release per month, each file named by its SHA-256. Written by" \
              "its archive_cards.yml workflow; nothing here is edited by hand." \
              > "$seed/README.md"
            git -C "$seed" init -q -b main
            git -C "$seed" add README.md
            git -C "$seed" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Start the card store"
            git -C "$seed" push -q "$cards_url" main
          fi
          manifest=tmp/archive/pdfs.json
          [ -s "$manifest" ] || echo '{}' > "$manifest"
          for dir in tmp/pdfs/cards-*/; do
            [ -d "$dir" ] || continue
            tag=$(basename "$dir")
            if ! gh release view "$tag" --repo "$CARDS_REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$CARDS_REPO"                 --title "Tariff cards $tag"                 --notes "The PDF tariff cards the archive branch of homeassistant_be_electricity_prices refers to for ${tag#cards-}, each named by its SHA-256."
            fi
            have=$(gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq '.assets[].name')
            for pdf in "$dir"*.pdf; do
              name=$(basename "$pdf")
              if ! grep -qx "$name" <<<"$have"; then
                gh release upload "$tag" "$pdf" --repo "$CARDS_REPO"
              fi
              jq --arg d "${name%.pdf}" --arg p "$tag/$name" '. + {($d): $p}'                 "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
            done
          done
          # Same retention as the branch: a month older than three years goes.
          cutoff="cards-$(date -u -d '-36 months' +%Y-%m)"
          gh release list --repo "$CARDS_REPO" --json tagName --jq '.[].tagName'             | while read -r tag; do
              case "$tag" in cards-*) ;; *) continue ;; esac
              if [ "$tag" \< "$cutoff" ]; then
                gh release delete "$tag" --repo "$CARDS_REPO" --yes --cleanup-tag
              fi
            done

      - name: Commit and push what changed
        run: |
          cd tmp/archive
          git add -A
          if git diff --cached --quiet; then
            echo "no card changed today"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Cards seen on $(date -u +%Y-%m-%d)"
          git push origin archive
