name: Archive tariff cards

on:
  schedule:
    # 05:41 UTC = 06:41 CET / 07:41 CEST, after the suppliers' overnight
    # publication and before the 06:17 live check. Off the hour for the
    # reason live_check.yml spells out: the top of the hour is where GitHub
    # sheds scheduled runs first.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      backfill_months:
        description: >-
          Also mirror this many closed months before the current one from the
          supplier archives, for months the branch does not hold yet.
        default: "0"
        required: false
        type: string
      reparse:
        description: Replay every stored month through the parser even if it did not change.
        default: false
        required: false
        type: boolean
      rerender:
        description: Replay every stored month with its PDFs rendered afresh, for a PDF reader upgrade.
        default: false
        required: false
        type: boolean

# The job pushes to the archive branch, and nothing else does; issues so a
# failed run is filed rather than left on the Actions tab.
permissions:
  contents: write
  issues: write

# A manual run overlapping the schedule would push the same day's cards
# twice and the second push would be rejected as non-fast-forward. Queue
# it instead of cancelling: both runs are worth finishing.
concurrency:
  group: archive-cards
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # A full walk is about 250 cards, 21 minutes on a Raspberry Pi; a parse
    # that never returns is bounded per card by the script. A backfill asks
    # one archived card per supplier, contract, region and month on top,
    # so a dispatch that asks for one gets six hours.
    timeout-minutes: ${{ ((github.event.inputs.backfill_months != '' && github.event.inputs.backfill_months != '0') || github.event.inputs.rerender == 'true') && 360 || 60 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The script imports the integration package itself (for the
          # snapshot codec the Store uses), so it needs what the package
          # imports at module level: homeassistant, defusedxml for api.py
          # and the two PDF readers. Versions come from requirements-dev.txt
          # so this runs against what the test suite proved.
          # freezegun pins the clock to a row's capture day while a stored
          # month is replayed through the current parser.
          pip install -c requirements-dev.txt \
            pypdf pdfplumber aiohttp defusedxml homeassistant freezegun

      - name: Check out the archive branch
        # The archive lives on its own branch so three years of daily
        # commits stay out of main's history and out of every HACS
        # download. Checked out as a worktree under tmp/, which main's
        # .gitignore covers. The first run creates the branch unborn.
        run: |
          if git fetch --depth=1 origin archive; then
            git worktree add --detach tmp/archive FETCH_HEAD
            git -C tmp/archive checkout -B archive
          else
            git worktree add --orphan -b archive tmp/archive
          fi

      - name: Store today's cards
        id: store
        env:
          CARDS_REPO: renaudallard/homeassistant_be_electricity_prices_cards
        run: >-
          python scripts/archive_cards.py --out tmp/archive --pdfs tmp/pdfs
          --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download"
          --backfill "${{ github.event.inputs.backfill_months || '0' }}"
          ${{ github.event.inputs.reparse == 'true' && '--reparse' || '' }}
          ${{ github.event.inputs.rerender == 'true' && '--rerender' || '' }}

      - name: Keep the cards themselves
        id: keep
        # The PDFs go to a separate repository's releases, named by the
        # month they were captured in and by their SHA-256: a month of cards
        # is about 100 MB, which no git branch of this repository should
        # carry and which HACS would mistake for a release if it lived here.
        # GitHub caps a release at a thousand assets, so a month that
        # overflows (a backfill does) spills into cards-YYYY-MM-2 and on;
        # the manifest on the branch says which one holds each file. Needs a
        # fine-grained token with contents read and write on that repository
        # in the BE_ELECTRICITY_CARDS secret; without it the step says so and
        # the branch still gets the parsed cards and their texts.
        env:
          GH_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
          CARDS_REPO: renaudallard/homeassistant_be_electricity_prices_cards
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "BE_ELECTRICITY_CARDS is not set: today's PDFs are not kept" >&2
            exit 0
          fi
          # A release needs a commit to tag, and a repository created empty
          # has none: give it a first one, once.
          cards_url="https://x-access-token:${GH_TOKEN}@github.com/${CARDS_REPO}.git"
          if [ -z "$(git ls-remote --heads "$cards_url" 2>/dev/null)" ]; then
            seed=$(mktemp -d)
            printf '%s\n' \
              "# Tariff cards" \
              "" \
              "The PDF tariff cards the archive branch of homeassistant_be_electricity_prices" \
              "refers to, one release per month, each file named by its SHA-256. Written by" \
              "its archive_cards.yml workflow; nothing here is edited by hand." \
              > "$seed/README.md"
            git -C "$seed" init -q -b main
            git -C "$seed" add README.md
            git -C "$seed" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Start the card store"
            git -C "$seed" push -q "$cards_url" main
          fi
          manifest=tmp/archive/pdfs.json
          [ -s "$manifest" ] || echo '{}' > "$manifest"
          ensure_release() {
            gh release view "$1" --repo "$CARDS_REPO" >/dev/null 2>&1 && return 0
            gh release create "$1" --repo "$CARDS_REPO" --title "Tariff cards $1" --notes "The PDF tariff cards the archive branch of homeassistant_be_electricity_prices refers to, captured in $2, each named by its SHA-256."
          }
          for dir in tmp/pdfs/cards-*/; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            month=${base#cards-}
            # Every shard of this month that exists: which file is where,
            # and how full the last one is.
            : > have.txt
            n=1; tag=$base; count=0
            while gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq ".assets[].name | \"\(.) $tag\"" >> have.txt 2>/dev/null; do
              count=$(gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq '.assets | length')
              next="$base-$((n + 1))"
              gh release view "$next" --repo "$CARDS_REPO" >/dev/null 2>&1 || break
              n=$((n + 1)); tag=$next
            done
            ensure_release "$tag" "$month"
            # Where each file landed, merged into the manifest once per
            # month rather than once per file: a backfill day uploads a
            # thousand files, and rewriting the whole manifest for each
            # took longer than some of the uploads.
            : > landed.txt
            for pdf in "$dir"*.pdf; do
              name=$(basename "$pdf")
              where=$(awk -v f="$name" '$1 == f {print $2; exit}' have.txt)
              if [ -z "$where" ]; then
                if [ "$count" -ge 1000 ]; then
                  n=$((n + 1)); tag="$base-$n"; count=0
                  ensure_release "$tag" "$month"
                fi
                gh release upload "$tag" "$pdf" --repo "$CARDS_REPO"
                count=$((count + 1))
                where=$tag
              fi
              echo "${name%.pdf} $where/$name" >> landed.txt
            done
            if [ -s landed.txt ]; then
              jq -Rn '[inputs | split(" ") | {(.[0]): .[1]}] | add // {}' landed.txt > landed.json
              jq -s '.[0] + .[1]' "$manifest" landed.json > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
            fi
          done
          # Same retention as the branch: a month older than three years goes.
          cutoff="cards-$(date -u -d '-36 months' +%Y-%m)"
          gh release list --repo "$CARDS_REPO" --json tagName --jq '.[].tagName'             | while read -r tag; do
              case "$tag" in cards-*) ;; *) continue ;; esac
              if [ "$tag" \< "$cutoff" ]; then
                gh release delete "$tag" --repo "$CARDS_REPO" --yes --cleanup-tag
              fi
            done

      - name: Commit and push what changed
        id: push
        run: |
          cd tmp/archive
          git add -A
          if git diff --cached --quiet; then
            echo "no card changed today"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Cards seen on $(date -u +%Y-%m-%d)"
          git push origin archive

      - name: File the failure as an issue
        # Nobody watches the Actions tab. A run that stored nothing, a push
        # that was refused or an upload token that has expired (fine-grained
        # tokens live a year at most) would otherwise end the archive quietly.
        # Same label-deduplicated shape as the live check's issues: one open
        # issue per problem, a comment per further failing run, and it says
        # which step failed so the token case is told from the others.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label='archive-cards'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed=''
          [ "${{ steps.store.outcome }}" = 'failure' ] && failed='Store today'"'"'s cards (the walk stored nothing, or crashed)'
          [ "${{ steps.keep.outcome }}" = 'failure' ] && failed='Keep the cards themselves (the upload to the cards repository; check the BE_ELECTRICITY_CARDS token, it expires)'
          [ "${{ steps.push.outcome }}" = 'failure' ] && failed='Commit and push what changed (the push to the archive branch)'
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            echo "## Failed step"
            echo
            echo "${failed:-an earlier step; see the run}"
          } > issue_body.md
          # The failed step is the fingerprint: the same step failing again
          # within the week adds nothing, a different one is posted at once.
          echo "${failed:-unknown}" > failed_step.txt
          bash scripts/file_ci_issue.sh \
            --label "$label" \
            --title "[archive-cards] the card archive run failed" \
            --body issue_body.md \
            --fingerprint failed_step.txt \
            --workflow .github/workflows/archive_cards.yml
