name: Archive tariff cards

on:
  schedule:
    # 05:41 UTC, after the suppliers' overnight publication and ahead of the
    # live check, which reads what this stores. Off the hour, and hours later
    # than it asks for, both for the reasons live_check.yml spells out.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      backfill_months:
        description: >-
          Also mirror this many closed months before the current one from the
          supplier archives, for months the archive does not hold yet. At
          most 12, the months the archive keeps.
        default: "12"
        required: false
        type: string
      reparse:
        description: Replay every stored month through the parser even if it did not change.
        default: false
        required: false
        type: boolean
      rerender:
        description: Replay every stored month with its PDFs rendered afresh, for a PDF reader upgrade.
        default: false
        required: false
        type: boolean

# The run pushes to the cards repository, and nothing else does; issues so
# a failed run is filed rather than left on the Actions tab.
# Read only on this repository: every write, the push and the releases,
# goes through the cards repository's own token; github.token is used by the
# issue steps alone.
permissions:
  contents: read
  issues: write

# A manual run overlapping the schedule would push the same day's cards
# twice and the second push would be rejected as non-fast-forward. Queue
# it instead of cancelling: both runs are worth finishing.
concurrency:
  group: archive-cards
  cancel-in-progress: false

# Four jobs, so the cards token never shares a runner with third-party code.
# The walk and the index run the integration and the PDF readers, which
# could leave a git hook, a git config entry or a GITHUB_ENV line for any
# later step on their runner; neither is given the token. The two jobs that
# hold it, keep and push, run only gh, git and jq, and take what the others
# wrote as artifacts: plain files, never a .git directory.
jobs:
  walk:
    runs-on: ubuntu-latest
    # The walk's own budget sits on its step below; this only bounds the
    # install and the hand-over around it.
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # 3.14 for ocr_price_cards, which needs it; the rest of the stack
          # runs on both and the test suite gates on 3.13, which is what an
          # installation runs. Only this job reads cards published as page
          # images, and only this job needs the newer interpreter.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The script imports the integration package itself (for the
          # snapshot codec the Store uses), so it needs what the package
          # imports at module level: homeassistant, defusedxml for api.py
          # and the two PDF readers. Versions come from requirements-dev.txt
          # so this runs against what the test suite proved.
          # freezegun pins the clock to a row's capture day while a stored
          # month is replayed through the current parser.
          pip install -c requirements-dev.txt \
            pypdf pdfplumber aiohttp defusedxml homeassistant freezegun
          # The reader for cards published as page images. Installed here and
          # nowhere else: an installation never runs OCR, it reads the rows
          # this walk writes. Unconstrained because its numpy and pypdfium2
          # are its own business and the test suite pins neither; the parser
          # stamp records both, so a release of either reads those cards again.
          pip install \
            "ocr-price-cards @ git+https://github.com/renaudallard/ocr_price_cards@main"

      - name: Check out the cards repository
        # Everything a card leaves behind lives in be_price_cards, beside
        # the cards themselves: the rows, the texts they were parsed from,
        # the manifest and the sheets. None of it belongs in the
        # integration's repository, and three years of daily commits
        # certainly do not belong in every HACS download. Cloned shallow
        # under tmp/, which main's .gitignore covers, and without the token:
        # the repository is public, and this job runs third-party code.
        env:
          CARDS_REPO: renaudallard/be_price_cards
        run: |
          git clone -q --depth=1 "https://github.com/${CARDS_REPO}.git" tmp/cards
          mkdir -p tmp/cards/electricity

      - name: Size the walk's budget
        id: budget
        # A kept card whose text other readers or render code made is
        # rendered afresh, every one after a reader upgrade, the six-hour
        # job a dispatched re-render gets; the script decides from the same
        # records on the rows.
        run: |
          due=$(python -c 'import sys; sys.path.insert(0, "scripts"); from pathlib import Path; import archive_cards; print(str(archive_cards.rerender_due(Path("tmp/cards/electricity"))).lower())')
          echo "rerender=$due" >> "$GITHUB_OUTPUT"

      - name: Store today's cards
        id: store
        # A full walk is about 250 cards, 21 minutes on a Raspberry Pi; a
        # parse that never returns is bounded per card by the script. The
        # schedule mirrors the last 12 months too, so a supplier added since
        # the last run gets its year filled with no one asking, a year being
        # as far back as a promotion's signing month matters. Once they are
        # filled a month on disk is never asked again, and only the months
        # the suppliers do not serve are: 808 of them, 18 minutes against 3
        # for the walk alone, measured on 2026-09-29, so the hour holds. A
        # manual backfill asks for as many months as it is told and a
        # re-render fetches every kept card back, so either gets six hours.
        timeout-minutes: ${{ (steps.budget.outputs.rerender == 'true' || (github.event.inputs.backfill_months != '' && github.event.inputs.backfill_months != '0') || github.event.inputs.rerender == 'true') && 360 || 60 }}
        # The dispatch inputs reach the shell through the environment, not
        # pasted into the command, so what is typed there is only ever an
        # argument.
        env:
          CARDS_REPO: renaudallard/be_price_cards
          BACKFILL: ${{ github.event.inputs.backfill_months || '12' }}
          REPARSE: ${{ github.event.inputs.reparse == 'true' && '--reparse' || '' }}
          RERENDER: ${{ github.event.inputs.rerender == 'true' && '--rerender' || '' }}
        run: >-
          mkdir -p tmp/ocr &&
          python scripts/archive_cards.py --out tmp/cards/electricity --pdfs tmp/pdfs
          --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download"
          --archive-base-url "https://github.com/${CARDS_REPO}/blob/main/electricity"
          --backfill "$BACKFILL"
          --ocr-failures tmp/ocr/ocr_failed.txt
          ${REPARSE:+"$REPARSE"}
          ${RERENDER:+"$RERENDER"}

      - name: Find glyphs the OCR library has not learnt
        # The OCR reads a font only through the glyphs it has learnt, and no
        # Ecofix card it learnt from sets bold 4, 7, 8, 9, Q, X, Y or Z. A card
        # published as page images still embeds the fonts of the text set over
        # its picture, so a card stored today can carry a glyph the library
        # lacks before any card needs it read from pixels, and is the card to
        # learn it from. The ocr job files what this finds; a check that fails
        # says so in the log and the run goes on, since a gap is a reason to
        # retrain, not a broken archive. No token here: the engine is
        # installed from its main branch.
        if: steps.store.outcome == 'success'
        continue-on-error: true
        run: |
          [ -d tmp/pdfs ] || exit 0
          mapfile -d '' cards < <(find tmp/pdfs -name '*.pdf' -print0 | sort -z)
          [ "${#cards[@]}" -gt 0 ] || exit 0
          status=0
          ocr-price-cards unlearnt "${cards[@]}" > unlearnt.txt || status=$?
          [ "$status" -eq 0 ] && exit 0
          [ "$status" -eq 1 ] || exit "$status"
          mkdir -p tmp/ocr
          mv unlearnt.txt tmp/ocr/unlearnt.txt

      - name: Hand the walk over
        # The rows, texts, sheets and manifest the walk wrote, and the PDFs
        # it fetched. The PDF folder always holds a file, so a day with no
        # new card still hands over an artifact for the keep job to read.
        run: |
          mkdir -p tmp/pdfs
          echo "PDFs fetched by this run, by month" > tmp/pdfs/README

      - uses: actions/upload-artifact@v7
        with:
          name: walk-cards
          path: tmp/cards/electricity
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: walk-pdfs
          path: tmp/pdfs
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: walk-ocr
          path: |
            tmp/ocr/ocr_failed.txt
            tmp/ocr/unlearnt.txt
          if-no-files-found: error
          retention-days: 3

  ocr:
    # Files the cards the OCR could not read, and the glyphs its library
    # lacks. A card published as page images is read by the walk and nowhere
    # else: the live check has no reading of its bytes and can only note it,
    # and the walk succeeds while any other card is stored. Its own job, so
    # github.token never shares a runner with the readers and the engine; it
    # takes the walk's lists as an artifact.
    needs: walk
    if: ${{ !cancelled() && needs.walk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: walk-ocr
          path: tmp/ocr

      - name: Report cards the OCR could not read
        # One issue says so, the same cards posted once a week at most.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s tmp/ocr/ocr_failed.txt ] || exit 0
          {
            echo "## Cards the OCR could not read"
            echo
            echo "Each line is the card and the error:"
            echo
            echo '```'
            cat tmp/ocr/ocr_failed.txt
            echo '```'
            echo
            echo "The OCR leaves out every line it refused a mark on, so a figure"
            echo "missing from its reading is most often a glyph its library lacks."
          } > ocr_failed_body.md
          # The cards, not the errors: the same card failing again tomorrow
          # adds nothing, another card is posted at once.
          cut -d ':' -f 1 tmp/ocr/ocr_failed.txt | sort -u > ocr_failed_fingerprint.txt
          bash scripts/file_ci_issue.sh \
            --label archive-cards-ocr \
            --title "[archive-cards] the OCR could not read a card" \
            --body ocr_failed_body.md \
            --fingerprint ocr_failed_fingerprint.txt \
            --workflow .github/workflows/archive_cards.yml

      - name: Report glyphs the OCR library has not learnt
        # One issue says so, the same gap posted once a week at most.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s tmp/ocr/unlearnt.txt ] || exit 0
          {
            echo "## Glyphs the OCR library has not learnt"
            echo
            echo "Cards stored by this run embed characters, in a font the OCR has learnt"
            echo "from, that its glyph library holds no template of. Each line is the card,"
            echo "the font and the characters:"
            echo
            echo '```'
            cat tmp/ocr/unlearnt.txt
            echo '```'
            echo
            echo "Learn them in ocr_price_cards with \`ocr-price-cards specimen\` on one of"
            echo "these cards (the PDF is the release asset of that name), check the"
            echo "library and release it."
          } > unlearnt_body.md
          # The fonts and characters, not the cards: the same gap seen on next
          # month's card adds nothing.
          cut -d ' ' -f 2- tmp/ocr/unlearnt.txt | sort -u > unlearnt_fingerprint.txt
          bash scripts/file_ci_issue.sh \
            --label archive-cards-glyphs \
            --title "[archive-cards] a card embeds glyphs the OCR library has not learnt" \
            --body unlearnt_body.md \
            --fingerprint unlearnt_fingerprint.txt \
            --workflow .github/workflows/archive_cards.yml

  keep:
    # Holds the cards token and runs no code of this repository or its
    # dependencies: gh, git and jq on the walk's files.
    needs: walk
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check the cards token is set
        env:
          CARDS_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
        run: '[ -n "$CARDS_TOKEN" ] || { echo "no cards token"; exit 1; }'

      - uses: actions/download-artifact@v8
        with:
          name: walk-cards
          path: tmp/cards/electricity

      - uses: actions/download-artifact@v8
        with:
          name: walk-pdfs
          path: tmp/pdfs

      - name: Keep the cards themselves
        id: keep
        # The PDFs go to the releases of be_price_cards, a repository shared
        # with the gas and water integrations: this integration's releases
        # are named electricity-<YYYY-MM> after the month the cards are for,
        # the files by their SHA-256. A month of cards is about 100 MB, which
        # no git tree should carry and which HACS would mistake for a release
        # if it lived in this repository. GitHub caps a release at a thousand
        # assets, five times what a month holds; should a month ever overflow
        # it spills into electricity-YYYY-MM-2, and pdfs.json says which
        # release holds each file. Needs a fine-grained token with contents
        # read and write on that repository in the BE_ELECTRICITY_CARDS
        # secret; without it the step says so and the archive still gets the
        # parsed cards and their texts.
        env:
          GH_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
          CARDS_REPO: renaudallard/be_price_cards
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "BE_ELECTRICITY_CARDS is not set: today's PDFs are not kept" >&2
            exit 0
          fi
          # A release needs a commit to tag, and a repository created empty
          # has none: give it a first one, once.
          cards_url="https://x-access-token:${GH_TOKEN}@github.com/${CARDS_REPO}.git"
          if [ -z "$(git ls-remote --heads "$cards_url" 2>/dev/null)" ]; then
            seed=$(mktemp -d)
            printf '%s\n' \
              "# Price cards" \
              "" \
              "The original tariff cards the Belgian price integrations refer to, kept as" \
              "release assets named by their SHA-256, one namespace per integration." \
              "Nothing here is edited by hand." \
              > "$seed/README.md"
            git -C "$seed" init -q -b main
            git -C "$seed" add README.md
            git -C "$seed" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Start the card store"
            git -C "$seed" push -q "$cards_url" main
          fi
          manifest=tmp/cards/electricity/pdfs.json
          [ -s "$manifest" ] || echo '{}' > "$manifest"
          ensure_release() {
            gh release view "$1" --repo "$CARDS_REPO" >/dev/null 2>&1 && return 0
            gh release create "$1" --repo "$CARDS_REPO" --title "Electricity cards $2" --notes "The PDF tariff cards for $2 that the card archive of homeassistant_be_electricity_prices refers to, each named by its SHA-256. Which card each file is: search this repository for the file name; the sheets under https://github.com/${CARDS_REPO}/tree/main/electricity/coverage link every contract and month to its card and to what was parsed out of it."
          }
          # An upload that fails stops the uploads, and the month's files
          # that did land still reach the manifest before the step fails.
          failed=0
          for dir in tmp/pdfs/electricity-*/; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            month=${base#electricity-}
            # Every release of this month that exists (normally one; a
            # month never nears the cap): which file is where, and how full
            # the last one is.
            : > have.txt
            n=1; tag=$base; count=0
            while gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq ".assets[].name | \"\(.) $tag\"" >> have.txt 2>/dev/null; do
              count=$(gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq '.assets | length')
              next="$base-$((n + 1))"
              gh release view "$next" --repo "$CARDS_REPO" >/dev/null 2>&1 || break
              n=$((n + 1)); tag=$next
            done
            ensure_release "$tag" "$month"
            # Where each file landed, merged into the manifest once per
            # month rather than once per file: a backfill day uploads a
            # thousand files, and rewriting the whole manifest for each
            # took longer than some of the uploads.
            : > landed.txt
            for pdf in "$dir"*.pdf; do
              name=$(basename "$pdf")
              where=$(awk -v f="$name" '$1 == f {print $2; exit}' have.txt)
              if [ -z "$where" ]; then
                if [ "$count" -ge 1000 ]; then
                  n=$((n + 1)); tag="$base-$n"; count=0
                  ensure_release "$tag" "$month"
                fi
                if ! gh release upload "$tag" "$pdf" --repo "$CARDS_REPO"; then
                  failed=1
                  break
                fi
                count=$((count + 1))
                where=$tag
              fi
              echo "${name%.pdf} $where/$name" >> landed.txt
            done
            if [ -s landed.txt ]; then
              jq -Rn '[inputs | split(" ") | {(.[0]): .[1]}] | add // {}' landed.txt > landed.json
              jq -s '.[0] + .[1]' "$manifest" landed.json > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
            fi
            [ "$failed" -eq 0 ] || break
          done
          # The rows are pushed all the same (the steps below run on a failed
          # upload), and the next run offers the PDFs that did not land again:
          # the current month's from the live walk, a past month's by asking
          # the supplier's archive for that month once more.
          [ "$failed" -eq 0 ] || exit 1
          # Same retention as the rows: a month more than twelve back goes.
          # Only this integration's releases, not the gas or water ones, and
          # counted from the 1st so no day of the month shifts the cutoff.
          # Listed with an explicit limit: gh stops at 30 by default, and with
          # two releases a month the ones past the cutoff would sit beyond it
          # from 2029 on, never listed and never deleted. A release pdfs.json
          # still lists stays: an unchanged card is uploaded once, under the
          # month it was first captured in, and the walk keeps its entry while
          # a kept row names it.
          cutoff="electricity-$(date -u -d "$(date -u +%Y-%m-01) -12 months" +%Y-%m)"
          jq -r '.[] | split("/")[0]' "$manifest" | sort -u > named.txt
          gh release list --repo "$CARDS_REPO" --limit 1000 --json tagName --jq '.[].tagName'             | while read -r tag; do
              case "$tag" in electricity-*) ;; *) continue ;; esac
              grep -qxF "$tag" named.txt && continue
              if [ "$tag" \< "$cutoff" ]; then
                gh release delete "$tag" --repo "$CARDS_REPO" --yes --cleanup-tag
              fi
            done

      - name: Hand the manifest over
        # Whatever the uploads did, so the files that landed before one
        # failed still reach the index and the push.
        if: ${{ !cancelled() && steps.keep.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: kept-manifest
          path: tmp/cards/electricity/pdfs.json
          if-no-files-found: error
          retention-days: 3

  index:
    # Runs the integration again, so no token. It runs whenever the walk
    # succeeded, even when an upload failed: skipped, the push behind it
    # threw away the day's rows and texts, and a card a supplier replaces at
    # a fixed URL was lost for good.
    needs: [walk, keep]
    if: ${{ !cancelled() && needs.walk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-dev.txt \
            pypdf pdfplumber aiohttp defusedxml homeassistant freezegun

      - uses: actions/download-artifact@v8
        with:
          name: walk-cards
          path: tmp/cards/electricity

      - name: Take the kept manifest
        # Missing when the keep job stopped before its uploads; the walk's
        # manifest stands then, and the next run offers the PDFs again.
        id: manifest
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: kept-manifest
          path: tmp/cards/electricity

      - name: Index the kept cards for people
        # The walk wrote the coverage sheets before today's uploads were
        # in the manifest; rewrite them now so every month links to a file
        # that exists. No fetch, a second or two.
        env:
          CARDS_REPO: renaudallard/be_price_cards
        run: >-
          python scripts/archive_cards.py --out tmp/cards/electricity --index-only
          --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download"
          --archive-base-url "https://github.com/${CARDS_REPO}/blob/main/electricity"

      - name: Write the two READMEs
        # The walk has already written the rows, the texts, the manifest and
        # the sheets under tmp/cards/electricity. These two say what a
        # person is looking at; the push job sends the lot. The root README
        # is the same text the gas and water workflows write, so none of the
        # three rewrites another's.
        run: |
          printf '%s\n' \
            "# Price cards" \
            "" \
            "The tariff cards the Belgian price integrations read, kept as release assets" \
            "named by their SHA-256. One namespace per integration, whose own README says" \
            "what it keeps beside the cards:" \
            "" \
            "- \`electricity/\`: homeassistant_be_electricity_prices, releases \`electricity-<YYYY-MM>\`." \
            "- \`gas/\`: homeassistant_be_gas_prices, releases \`gas-<YYYY-MM>\`." \
            "- \`water/\`: homeassistant_be_water_prices, releases \`water-<YYYY-MM>\`." \
            "" \
            "Nothing here is edited by hand." \
            > tmp/cards/README.md
          printf '%s\n' \
            "# Electricity cards" \
            "" \
            "What homeassistant_be_electricity_prices read from each supplier's tariff card," \
            "written daily by its \`archive_cards.yml\` workflow." \
            "" \
            "- \`coverage.md\`: the index of one sheet per supplier under \`coverage/\`; each" \
            "  sheet lists per contract and region the months held, each linking to its card" \
            "  and to what was parsed out of it." \
            "- \`cards/<supplier>/<contract>/<region>/<YYYY-MM>.json\`: the card as the" \
            "  integration parsed it. This is what an installation reads for a past month." \
            "- \`texts/<YYYY-MM>/<sha256>.txt\`: the document text a parse read, stored once" \
            "  and shared between the cards that read it. A card handed over inside another" \
            "  document is a \`{{card:<sha256>}}\` reference rather than a second copy of it." \
            "- \`pdfs.json\`: which release holds each card, by SHA-256." \
            "- \`unparsed.json\`: the cards kept that no reader could read, by the row they" \
            "  would have become." \
            "- \`vat.json\`: per month, the VAT rate the cards agree on (three suppliers or" \
            "  more stating one rate and none another), residential and professional; a" \
            "  month they disagree on is listed as disputed and read by no installation." \
            "" \
            "The PDFs themselves are the assets of the \`electricity-<YYYY-MM>\` releases of" \
            "this repository, one release per month of cards, each file named by its SHA-256." \
            > tmp/cards/electricity/README.md

      - uses: actions/upload-artifact@v7
        with:
          name: indexed-cards
          path: |
            tmp/cards/README.md
            tmp/cards/electricity
          if-no-files-found: error
          retention-days: 3

  push:
    # Holds the cards token and runs no code of this repository or its
    # dependencies: a fresh clone, the indexed files laid over it as plain
    # files, git.
    needs: index
    if: ${{ !cancelled() && needs.index.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the cards repository
        env:
          CARDS_REPO: renaudallard/be_price_cards
        run: git clone -q --depth=1 "https://github.com/${CARDS_REPO}.git" tmp/cards

      - uses: actions/download-artifact@v8
        with:
          name: indexed-cards
          path: tmp/indexed

      - name: Lay the indexed files over the clone
        # The electricity tree is replaced whole, so a row the walk pruned
        # goes, and the root README is the one the three archives share.
        run: |
          rm -rf tmp/cards/electricity
          cp -R tmp/indexed/electricity tmp/cards/electricity
          cp tmp/indexed/README.md tmp/cards/README.md

      - name: Commit and push what changed
        id: push
        env:
          CARDS_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
        run: |
          cd tmp/cards
          # The token as an authorization header on each call that needs it,
          # as actions/checkout passes its own, never written to .git/config.
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${CARDS_TOKEN:-}" | base64 -w0)"
          git add -A
          if git diff --cached --quiet; then
            echo "no card changed today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Cards seen on $(date -u +%Y-%m-%d)"
          # The gas and water archives push to the same main, and the
          # concurrency group only queues runs of this repository, so their
          # daily push can land between this job's clone and this push. The
          # three trees share one path, the root README.md, which all three
          # jobs write with the same text, so rebasing onto another job's
          # commit is conflict-free: a rejected push fetches, rebases and
          # tries again rather than losing the run. Should one of the texts
          # drift, -X theirs (the commit being replayed) keeps this job's.
          # A pull that fails, a network blip or a rebase that stops, is left
          # to the next attempt rather than ending the step.
          for attempt in 1 2 3 4 5; do
            git -c "$auth" push -q origin HEAD:main && exit 0
            [ "$attempt" -lt 5 ] || break
            sleep $((attempt * 3))
            git -c "$auth" pull -q --rebase -X theirs origin main \
              || git rebase --abort 2>/dev/null || true
          done
          exit 1

  token:
    # Holds the cards token; runs gh and the issue script only.
    needs: push
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Warn before the upload token expires
        # A fine-grained token lives a year at most, and the first sign of
        # its expiry would otherwise be the failure issue on the morning
        # after. GitHub reports a fine-grained token's expiry in a response
        # header, so ask, and file an issue while there are still two weeks
        # to make a new one and update the secret. Runs even when an earlier
        # step failed: the warning is worth having either way. After the
        # push, so a failure here cannot keep the day's rows from being
        # pushed.
        env:
          CARDS_TOKEN: ${{ secrets.BE_ELECTRICITY_CARDS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CARDS_TOKEN" ] || exit 0
          expires=$(GH_TOKEN=$CARDS_TOKEN gh api -i /user 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1) == "github-authentication-token-expiration" {print $2}')
          if [ -z "$expires" ]; then
            echo "the upload token reports no expiry"
            exit 0
          fi
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u +%s) ) / 86400 ))
          echo "the upload token expires on $expires ($left days left)"
          [ "$left" -le 14 ] || exit 0
          {
            echo "## The upload token expires on $expires"
            echo
            echo "$left day(s) left. Create a new fine-grained token with contents read and"
            echo "write on the cards repository and store it as the BE_ELECTRICITY_CARDS"
            echo "secret; until then the PDFs of each day are offered again by the next run"
            echo "that has a working token."
          } > token_body.md
          echo "token expires $expires" > token_fingerprint.txt
          # Its own label: file_ci_issue.sh finds the open issue by label, so
          # sharing the failure issue's posted this warning inside an open
          # failure thread, and a failure inside this one.
          bash scripts/file_ci_issue.sh \
            --label archive-cards-token \
            --title "[archive-cards] the upload token expires soon" \
            --body token_body.md \
            --fingerprint token_fingerprint.txt \
            --workflow .github/workflows/archive_cards.yml

  report:
    needs: [walk, keep, index, push, token]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: File the failure as an issue
        # Nobody watches the Actions tab. A run that stored nothing, a push
        # that was refused or an upload token that has expired (fine-grained
        # tokens live a year at most) would otherwise end the archive quietly.
        # Same label-deduplicated shape as the live check's issues: one open
        # issue per problem, a comment per further failing run, and it says
        # which step failed so the token case is told from the others.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed=''
          [ "${{ needs.walk.result }}" = 'failure' ] && failed='Store today'"'"'s cards (the walk stored nothing, or crashed)'
          [ "${{ needs.keep.result }}" = 'failure' ] && failed='Keep the cards themselves (the upload to the cards repository; check the BE_ELECTRICITY_CARDS token, it expires)'
          [ "${{ needs.index.result }}" = 'failure' ] && failed='Index the kept cards for people (the sheets and READMEs written after the upload)'
          [ "${{ needs.push.result }}" = 'failure' ] && failed='Commit and push what changed (the push to the cards repository)'
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            echo "## Failed step"
            echo
            echo "${failed:-an earlier step; see the run}"
          } > issue_body.md
          # The failed step is the fingerprint: the same step failing again
          # within the week adds nothing, a different one is posted at once.
          echo "${failed:-unknown}" > failed_step.txt
          bash scripts/file_ci_issue.sh \
            --label archive-cards \
            --title "[archive-cards] the card archive run failed" \
            --body issue_body.md \
            --fingerprint failed_step.txt \
            --workflow .github/workflows/archive_cards.yml
