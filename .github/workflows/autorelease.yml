name: Autorelease

on:
  push:
    branches:
      - main
    paths:
      - custom_components/be_electricity_prices/manifest.json

permissions:
  contents: write

# Two manifest bumps in quick succession would otherwise race on git tag
# / gh release create. Serialise them per-ref so the second push waits
# for the first to finish (cancel-in-progress: false to avoid orphaning
# a half-published release).
concurrency:
  group: autorelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release on the real Tests workflow rather than a hand-copy of
  # it. It used to be inlined here with a note that the two must be kept in
  # sync; calling it removes the chance to forget.
  verify:
    uses: ./.github/workflows/test.yml
    # The test suite installs and runs third-party packages; it needs no
    # write token, and a reusable workflow gets the caller's.
    permissions:
      contents: read

  hacs:
    runs-on: ubuntu-latest
    # Pinned, but the action runs the ghcr.io/hacs/action:main image, which
    # its repository moves, so it gets no write token from the
    # workflow-level grant.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    # Pinned, but the action runs the untagged ghcr.io/home-assistant/hassfest
    # image, which Home Assistant moves, so it gets no write token from the
    # workflow-level grant.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  release:
    runs-on: ubuntu-latest
    needs: [verify, hacs, hassfest]
    env:
      # A release counts once it is published with the zip HACS installs.
      # gh release create makes a draft, uploads, then publishes, and the
      # lookup by tag finds a draft too, so one left by a create that died
      # at the publish call passed for the release.
      PUBLISHED: '(.isDraft | not) and any(.assets[]; .name == "be_electricity_prices.zip")'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          ver=$(jq -r .version custom_components/be_electricity_prices/manifest.json)
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then
            echo "no version in manifest.json" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check if the release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release, not the tag. The tag is pushed before the release is
          # created, so when every attempt below fails it is already on
          # origin, and a re-run that tested the tag skipped the release and
          # ended green with nothing published.
          # The step runs under bash -e, and the lookup fails whenever there
          # is no release yet, which is the usual case: without the || true
          # that failure ended the step.
          published=$(gh release view "${{ steps.version.outputs.tag }}" \
            --json isDraft,assets --jq "$PUBLISHED" 2>/dev/null || true)
          if [ "$published" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cd custom_components/be_electricity_prices
          zip -qr ../../dist/be_electricity_prices.zip . \
            -x '*.pyc' '__pycache__/*' '*/__pycache__/*'
          cd ../..
          unzip -l dist/be_electricity_prices.zip

      - name: Tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          tag="${{ steps.version.outputs.tag }}"
          # Tag + push are idempotent enough to leave outside the retry
          # loop: if the tag is already on origin, as it is on a re-run
          # after every attempt below failed, we still want to proceed to
          # release creation. The push command tolerates the "already
          # exists" case the same way 'git push origin <tag>' does locally.
          git tag "$tag"
          git push origin "$tag"
          # A draft an earlier attempt left behind is dropped before the
          # next one, keeping the tag. Only when the lookup resolves to a
          # draft: it finds a published release first, and that is never
          # deleted.
          drop_draft() {
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
              gh release delete "$tag" --yes
            fi
          }
          drop_draft
          # gh release create is the operation that lost v0.5.28 to a
          # 504 from GitHub's REST API. Retry up to 5 times with
          # exponential backoff so a transient API blip doesn't strand
          # a release without an attached zip.
          attempts=5
          delays="10 30 60 120"
          set -- $delays
          for i in $(seq 1 "$attempts"); do
            echo "::group::release attempt $i"
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              dist/be_electricity_prices.zip
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              break
            fi
            # If the release was published by an attempt that died
            # mid-call, treat it as success on the retry. A draft is not.
            if [ "$(gh release view "$tag" --json isDraft,assets --jq "$PUBLISHED" 2>/dev/null)" = "true" ]; then
              echo "release $tag already published, treating as success"
              rc=0
              break
            fi
            drop_draft
            if [ "$i" -lt "$attempts" ]; then
              sleep_for=$1
              shift
              echo "release attempt $i failed (exit $rc), sleeping ${sleep_for}s..." >&2
              sleep "$sleep_for"
            fi
          done
          exit $rc
