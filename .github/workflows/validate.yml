name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Off the hour for the reason live_check.yml spells out: the top of the
    # hour is where GitHub sheds scheduled runs first.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
