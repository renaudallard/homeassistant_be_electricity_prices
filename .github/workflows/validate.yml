name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Off the hour for the reason live_check.yml spells out: the top of the
    # hour is where GitHub sheds scheduled runs first.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Both actions are pinned to a commit, but each runs a Docker image its
# repository moves; neither needs to write anything.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
