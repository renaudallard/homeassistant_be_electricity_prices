name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so autorelease.yml can gate a release on exactly this suite
  # instead of keeping a hand-copy of it that can drift.
  workflow_call:

# Cancel a stale push/PR run when a new commit lands so we never queue
# multiple parallel runs for the same ref. github.workflow is the CALLER's
# name, so the standalone run and the one autorelease calls land in different
# groups -- without that they would share a group on a push to main and
# cancel-in-progress would kill the release's own gate.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (production code, --strict)
        run: mypy --strict custom_components/be_electricity_prices
      - name: Type check (tests + helper scripts, non-strict)
        # Tests aren't --strict-clean (the harness has untyped helpers
        # the integration code never imports), but a non-strict mypy
        # still catches Mapping[str,str]|None index errors and the
        # like. live_check.py runs as a daily workflow; covering it
        # here means a regression surfaces on PR rather than in the
        # next 06:17 UTC scheduled run.
        run: mypy custom_components/ tests/ scripts/
      - name: Doc references
        # The docs name about 2800 files and the symbols inside them. Fails on
        # a file a doc names that is not on disk and on a file.md#anchor that
        # matches no heading, both of which only a rename can cause and both
        # provably wrong. A symbol the tree does not define is counted and
        # never gated: too many of those are prose words to make a rule of.
        # Nothing here needs network or fixtures, so it runs before the suite
        # and reports in seconds.
        run: python scripts/doc_ref_check.py
      - name: Tests
        # Split across the runner's cores by file, so a file's fixtures are
        # built once in one worker rather than scattered. Measured on a
        # Raspberry Pi 5 over 2087 tests: 21:52 serial, 13:27 on two workers,
        # 9:58 on four. Per worker it costs one Home Assistant import, which
        # is why this is on the full suite and not in addopts: it would make
        # a single-file run during iteration slower, not faster.
        run: pytest tests/ -q -n auto --dist loadfile
