name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so autorelease.yml can gate a release on exactly this suite
  # instead of keeping a hand-copy of it that can drift.
  workflow_call:

# Cancel a stale push/PR run when a new commit lands so we never queue
# multiple parallel runs for the same ref. github.workflow is the CALLER's
# name, so the standalone run and the one autorelease calls land in different
# groups -- without that they would share a group on a push to main and
# cancel-in-progress would kill the release's own gate.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin homeassistant + pytest-homeassistant-custom-component
          # (and pytest-freezer used by the time-pinned tests) to
          # known-good versions; an upstream HA-core or test-shim
          # release would otherwise silently turn the suite red on main.
          pip install \
            ruff==0.16.0 \
            mypy \
            pytest \
            pytest-asyncio \
            pytest-freezer==0.4.9 \
            pypdf \
            pdfplumber \
            defusedxml \
            homeassistant==2026.2.3 \
            pytest-homeassistant-custom-component==0.13.316
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (production code, --strict)
        run: mypy --strict custom_components/be_electricity_prices
      - name: Type check (tests + helper scripts, non-strict)
        # Tests aren't --strict-clean (the harness has untyped helpers
        # the integration code never imports), but a non-strict mypy
        # still catches Mapping[str,str]|None index errors and the
        # like. live_check.py runs as a daily workflow; covering it
        # here means a regression surfaces on PR rather than in the
        # next 06:00 UTC scheduled run.
        run: mypy custom_components/ tests/ scripts/
      - name: Doc references
        # The docs pin ~760 file.py:line references, and they rot whenever a
        # module grows. Fails only on a reference past the end of the file it
        # names, which is provably broken; the judgement calls are printed
        # and left to a human. Nothing here needs network or fixtures, so it
        # runs before the suite and reports in seconds.
        run: python scripts/doc_ref_check.py
      - name: Tests
        run: pytest tests/ -q
