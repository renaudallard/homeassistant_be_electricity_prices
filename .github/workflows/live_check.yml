name: Live extractor check

on:
  schedule:
    # 06:17 UTC = 07:17 CET / 08:17 CEST, after the suppliers' overnight
    # publication. Off the hour on purpose: GitHub documents the start of every
    # hour as a high-load slot for the schedule event and drops queued runs out
    # of it when the load is bad enough. That is what took the 06:00 slot on
    # 2026-08-27, here and in validate.yml both, with no run created at all.
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "custom_components/be_electricity_prices/providers/**"
      - "scripts/live_check.py"
      - ".github/workflows/live_check.yml"

permissions:
  contents: read
  issues: write

# A new schedule fires while the previous one is still attempting
# retries, or two PRs touching providers/ overlap, would otherwise
# queue parallel runs that each open the same Repairs / GitHub issue.
# Serialise per-ref and let the new run win.
concurrency:
  group: live-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Must comfortably exceed the retry loop's wall-clock budget below
    # (capped at ~90 min) plus one final sweep and the issue-creation
    # steps. The previous 75 min was shorter than the ~59 min of sleeps
    # plus seven network sweeps, so a persistently broken extractor timed
    # the job out mid-retry and filed nothing. Still well under the 6 h
    # default so a hung run can't idle for hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # homeassistant is required because providers/_pdf.py imports
          # homeassistant.util.dt for the parse_valid_until clamp. Pin
          # the same version as test.yml so a breaking HA-core release
          # can't flip the daily live-check red while the integration
          # itself still works against the version users actually run.
          pip install pypdf pdfplumber aiohttp homeassistant==2026.2.3

      - name: Run live check (retries up to ~1 h on extractor failure)
        id: check
        run: |
          set +e
          # Two-tier retry: the fast early gaps clear brief blips within
          # ~9 min, then one ~50-min wait means an issue is only filed
          # when a supplier is STILL broken ~1 h after first detection,
          # not for a transient CDN timeout (issue #30). 7 attempts use
          # all six gaps (the previous 5/4 layout left the last delay dead).
          attempts=7
          delays="10 30 60 120 300 3000"
          set -- $delays
          # Wall-clock budget for the whole retry loop. A persistently
          # broken extractor keeps retrying, and the ~59 min of sleeps plus
          # seven network sweeps used to overrun the job timeout and cancel
          # the job BEFORE the issue-creation steps below, filing nothing.
          # Stop retrying once the next sleep would cross this deadline so
          # the issue always gets filed; the job timeout only needs to
          # cover this plus one final sweep and the gh steps.
          retry_deadline=$((SECONDS + 5400))
          # A check is worth filing only if it fails in EVERY attempt.
          # Breaking out on the first all-green attempt was not enough: on a
          # slow runner each attempt times out on a DIFFERENT random subset
          # of suppliers, so no attempt is ever green, and the loop filed
          # whichever three hosts were unlucky on the last one (issue #61:
          # six attempts, 21 failures, all TimeoutError, all transient, and
          # every one of them fetched fine off-runner). Intersecting the
          # per-attempt failures keeps a real regression (a parse error or
          # a withdrawn card fails the same checks every time) and drops
          # rotating network noise.
          : > persistent_failures.txt
          seeded=0
          for i in $(seq 1 "$attempts"); do
            echo "::group::attempt $i"
            # Drop the previous attempt's list so a harness death that
            # skips writing it can never be intersected as if it were
            # this attempt's result.
            rm -f extractor_failures.txt
            python scripts/live_check.py > report.md
            rc=$?
            cat report.md
            echo "::endgroup::"
            # rc bit 0 (1) = extractor failure — worth retrying.
            # rc bit 1 (2) = catalog signal, stable — don't retry.
            # rc bit 2 (4) = drift signal, stable — don't retry.
            # rc 0 = all green.
            # rc 8 = harness crash (top-level Python exception); the
            #        traceback is in the run's stdout. None of the
            #        issue-creation steps below fire for rc=8, so the
            #        PR check (last step) is the only push-time signal.
            if [ $((rc & 1)) -eq 0 ]; then
              # A green sweep clears the intersection: every earlier
              # failure has now passed at least once.
              : > persistent_failures.txt
              break
            fi
            # extractor_failures.txt is this attempt's failing check labels,
            # written by live_check.py alongside report.md. LC_ALL is pinned
            # because comm needs both inputs sorted in the same collation.
            LC_ALL=C sort -u extractor_failures.txt > attempt_failures.txt
            if [ "$seeded" -eq 0 ]; then
              cp attempt_failures.txt persistent_failures.txt
              seeded=1
            else
              LC_ALL=C comm -12 persistent_failures.txt attempt_failures.txt \
                > persistent_failures.tmp
              mv persistent_failures.tmp persistent_failures.txt
            fi
            if [ ! -s persistent_failures.txt ]; then
              echo "no check failed in every attempt; transient, not filing" >&2
              break
            fi
            if [ "$i" -lt "$attempts" ]; then
              sleep_for=$1
              shift
              if [ $((SECONDS + sleep_for)) -ge "$retry_deadline" ]; then
                echo "retry budget spent; filing on the current failure" >&2
                break
              fi
              echo "attempt $i failed (exit $rc), sleeping ${sleep_for}s..." >&2
              sleep "$sleep_for"
            fi
          done
          # Nothing failed every attempt: clear the extractor bit so the
          # steps below see the same rc they would on a green sweep. The
          # catalog and drift bits are stable across attempts and stay.
          if [ ! -s persistent_failures.txt ] && [ $((rc & 1)) -ne 0 ]; then
            echo "clearing extractor bit from rc=$rc (no persistent failure)" >&2
            rc=$((rc & ~1))
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Exit 0 here so subsequent issue-creation steps run regardless
          # of which kind of failure was detected; they branch on rc.
          exit 0

      - name: Open or update extractor-broken issue
        # rc bit 0 set: extractor failure. Skipped on pull_request so
        # PR-time runs fail the job (next step) instead of opening an
        # issue against the parent repo.
        if: |
          github.event_name != 'pull_request' && (
            steps.check.outputs.rc == '1'
            || steps.check.outputs.rc == '3'
            || steps.check.outputs.rc == '5'
            || steps.check.outputs.rc == '7'
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title_prefix='[live-check] supplier extractor broken'
          label='live-check-extractor'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            # These are the ones that failed every attempt of the retry
            # loop, so they are what to look at. The failures table below is
            # filtered to match: a check that any attempt passed is a slow
            # runner or a supplier blip, not a broken extractor, and listing
            # it invites someone to investigate a timeout that is not there.
            echo "## Persistent failures"
            echo
            echo "Failed on every attempt of the retry loop:"
            echo
            sed 's/^/- `/; s/$/`/' persistent_failures.txt
            echo
            echo "## Last report"
            echo
            if [ -s report.md ]; then
              # Two edits to the last attempt's report.
              #
              # Drop the "## All checks" checklist: the full report outgrew
              # GitHub's 65,536-character issue body limit, so createIssue
              # rejected it and nothing was filed at all. It only repeats
              # what the failures table says.
              #
              # And drop failures table rows for checks that a LATER attempt
              # passed. The table is the last attempt's, so on a slow runner
              # it carries one-off network timeouts beside the real
              # regressions, and they read as part of the fault being
              # reported. Only the rows are filtered; the count in the
              # heading is the raw one, and the omission is stated at the end
              # so nothing disappears silently.
              awk 'NR==FNR{keep[$0]=1; next}
                   /^## All checks$/{skip=1; next}
                   /^## /{skip=0; infail=($0=="## Failures")}
                   skip{next}
                   {
                     if (infail && $0 ~ /^\| `/) {
                       row=$0
                       sub(/^\| `/, "", row)
                       sub(/` \|.*$/, "", row)
                       if (!(row in keep)) { dropped++; next }
                     }
                     print
                   }
                   END{
                     if (dropped)
                       printf "\n_%d transient failure(s) that a later attempt passed are omitted from the table above; the run log has them._\n", dropped
                   }' persistent_failures.txt report.md
            else
              # No report at all means the harness died before printing
              # (see the CancelledError note in live_check.py). Filing the
              # bare heading leaves a triager nothing to go on, so say so
              # and point at the log, which still holds the traceback.
              echo "_No report: the harness produced no output on its last attempt,"
              echo "so it died before printing. The traceback is in the run log_"
            fi
          } > issue_body.md

          # Defensive cap: a mass failure could still blow the limit
          # through the failures table alone. Cut at a line boundary and
          # point at the run log for the rest.
          if [ "$(wc -c < issue_body.md)" -gt 60000 ]; then
            head -c 60000 issue_body.md | sed '$d' > issue_body.tmp
            printf '\n_[issue body truncated: full report in the run log]_\n' >> issue_body.tmp
            mv issue_body.tmp issue_body.md
          fi

          # Make sure the label exists; idempotent.
          gh label create "$label" \
            --color FBCA04 \
            --description "Auto-filed by .github/workflows/live_check.yml" \
            --force >/dev/null 2>&1 || true

          # Dedup on the deterministic label rather than a title
          # substring so a manually-opened "Re: [live-check] ..."
          # issue can never catch comments from this job.
          existing=$(gh issue list \
            --state open \
            --label "$label" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "appending comment to issue #$existing"
            gh issue comment "$existing" --body-file issue_body.md
          else
            gh issue create \
              --title "$title_prefix ($(date -u +%Y-%m-%d))" \
              --label "$label" \
              --body-file issue_body.md
          fi

      - name: Open or update drift issue
        # rc bit 2 (4): per-supplier latency or byte budget blown.
        # Independent issue from the extractor / catalog ones so the
        # three failure modes don't conflate in one thread. Skipped
        # on pull_request -- the failing job is the signal there.
        if: always() && github.event_name != 'pull_request' && (
            steps.check.outputs.rc == '4'
            || steps.check.outputs.rc == '5'
            || steps.check.outputs.rc == '6'
            || steps.check.outputs.rc == '7'
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title_prefix='[live-check] supplier drift detected'
          label='live-check-drift'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            echo "## Drift report"
            echo
            cat drift_report.md
          } > drift_issue_body.md

          gh label create "$label" \
            --color FBCA04 \
            --description "Auto-filed by .github/workflows/live_check.yml" \
            --force >/dev/null 2>&1 || true

          existing=$(gh issue list \
            --state open \
            --label "$label" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "appending comment to issue #$existing"
            gh issue comment "$existing" --body-file drift_issue_body.md
          else
            gh issue create \
              --title "$title_prefix ($(date -u +%Y-%m-%d))" \
              --label "$label" \
              --body-file drift_issue_body.md
          fi

      - name: Open or update new-products issue
        # rc bit 1 set: a new product was detected at a supplier we
        # know how to discover. Independent issue from the extractor
        # one so the two failure modes don't conflate in one thread.
        # Skipped on pull_request -- failing job is the signal.
        if: always() && github.event_name != 'pull_request' && (
            steps.check.outputs.rc == '2'
            || steps.check.outputs.rc == '3'
            || steps.check.outputs.rc == '6'
            || steps.check.outputs.rc == '7'
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title_prefix='[live-check] new supplier products detected'
          label='live-check-catalog'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            echo "## Catalog diff"
            echo
            cat catalog_report.md
          } > catalog_issue_body.md

          gh label create "$label" \
            --color FBCA04 \
            --description "Auto-filed by .github/workflows/live_check.yml" \
            --force >/dev/null 2>&1 || true

          existing=$(gh issue list \
            --state open \
            --label "$label" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "appending comment to issue #$existing"
            gh issue comment "$existing" --body-file catalog_issue_body.md
          else
            gh issue create \
              --title "$title_prefix ($(date -u +%Y-%m-%d))" \
              --label "$label" \
              --body-file catalog_issue_body.md
          fi

      - name: Fail PR job on extractor or drift signal
        # Surface live-check failures on the PR check status without
        # opening issues against the parent repo (which a fork-pushed
        # PR can't do anyway). Catalog signal alone (rc==2) is
        # informational, not a regression -- don't fail the PR for it.
        if: github.event_name == 'pull_request'
        run: |
          rc='${{ steps.check.outputs.rc }}'
          # Mask away the catalog-only bit; fail if anything else is set.
          if [ $((rc & ~2)) -ne 0 ]; then
            echo "live-check rc=$rc; failing PR check" >&2
            exit 1
          fi

      - name: Fail run on harness crash
        # rc=8 means scripts/live_check.py raised at the top level
        # (uncaught exception, e.g. unhandled aiohttp / SSL error in
        # the harness itself, not a supplier signal). None of the
        # issue-creation steps above fire for rc=8, so without this
        # the run would end green with the traceback buried in the
        # logs. Fail the run on push so it shows red on the Actions
        # tab; the PR-fail step above already covers PR runs.
        if: always() && github.event_name != 'pull_request' && steps.check.outputs.rc == '8'
        run: |
          echo "live-check harness crashed (rc=8); see traceback above" >&2
          exit 1
