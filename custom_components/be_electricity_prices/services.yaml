refresh:
  name: Refresh
  description: >-
    Force-refresh every Belgian Electricity Prices entry, or only the one
    chosen under Entry ID: drops the cached
    supplier snapshot, the month cards the year-to-date cost is billed on
    and TODAY's and tomorrow's ENTSO-E prices, then re-fetches them immediately. Useful after a tariff card update or to clear a temporary
    fetch error without waiting for the next refresh tick. It does NOT touch
    the cache of past hourly prices that the year-to-date cost replays; that
    needs clear_history below.
  fields:
    entry_id:
      name: Entry ID
      description: >-
        Refresh only this config entry. Every loaded entry is refreshed
        when omitted.
      example: 4f3c8...
      selector:
        config_entry:
          integration: be_electricity_prices
    clear_history:
      name: Clear price history
      description: >-
        Also discard the cached past hourly prices behind the year-to-date
        cost and re-fetch them. Off by default because it re-fetches every day
        since 1 January (or the contract start, if the entry bills from it)
        against a rate-limited endpoint. The days before that are not fetched
        again, so a feed-in credit that follows the spot price per slot drops
        out of the rolling year cost and the comparisons until a full year is
        held again. Short of a value off the scale, which a restart discards,
        nothing else can repair a wrong value in there: a cached day that
        looks complete is never re-fetched on its own.
      default: false
      selector:
        boolean:

cheapest_window:
  name: Cheapest window
  description: >-
    Find the cheapest contiguous window of N hours within the upcoming
    price table. Returns start, end, average EUR/kWh, the slot resolution
    and a per-slot breakdown (one row per price slot - hourly, or
    quarter-hourly on a 15-minute contract). Useful for scheduling EV
    charging or a heat pump.
  fields:
    duration_hours:
      name: Duration
      description: Window length in hours, rounded to the nearest whole hour (a half rounds up). On a 15-minute contract the window may start on any quarter-hour boundary.
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: h
    entry_id:
      name: Entry ID
      description: >-
        Target a specific config entry. Defaults to the first loaded entry
        when omitted (only matters if multiple suppliers are configured).
      example: 4f3c8...
      selector:
        config_entry:
          integration: be_electricity_prices
    earliest_start:
      name: Earliest start
      description: >-
        Don't consider windows starting before this time. The value is
        truncated down to its price slot (the hour, or the quarter on a
        15-minute contract), so 14:30 still considers the 14:00 slot
        (14:30 on a 15-minute contract). Default = now.
      example: "2026-04-30T20:00:00+02:00"
      selector:
        datetime:
    latest_end:
      name: Latest end
      description: Don't consider windows ending after this time.
      example: "2026-05-01T08:00:00+02:00"
      selector:
        datetime:

backfill_statistics:
  name: Backfill statistics
  description: >-
    Populate the recorder's long-term statistics for this entry's
    price sensors and current_year_cost over a date range. Useful to
    redo a window after fixing a tariff card or to seed history
    further back than the automatic year-to-date anchor. Re-runs are safe:
    rows are upserted by (statistic_id, hour). Pass clear=true to
    delete the target series first when the underlying tariff
    changed. A window ending on or before the start of the year-to-date
    window (1 January, or the contract start date if the entry bills
    from it) rebuilds the price sensors only: a cost series ending there
    would sit immediately before the current one and paint a large
    negative cost onto the Energy dashboard at the boundary, because
    the recorder ignores last_reset on imported statistics.
  fields:
    entry_id:
      name: Entry ID
      description: >-
        Target a specific config entry. Defaults to the first loaded
        entry when omitted (only matters if multiple suppliers are
        configured).
      example: 4f3c8...
      selector:
        config_entry:
          integration: be_electricity_prices
    start:
      name: Start
      description: >-
        First hour to backfill. Default = the start of the year-to-date
        window: Jan 1 00:00 of the current local year, or the contract
        start date if the entry bills from it.
      example: "2026-01-01T00:00:00+01:00"
      selector:
        datetime:
    end:
      name: End
      description: >-
        First hour NOT to backfill (exclusive). Default = current
        hour, so the in-progress hour the live coordinator is about
        to write itself stays untouched. Set this on or before the start
        of the year-to-date window and only the price sensors are rebuilt
        (see the description above).
      example: "2026-05-01T00:00:00+02:00"
      selector:
        datetime:
    clear:
      name: Clear ENTIRE series before re-import
      description: >-
        Destructive: deletes EVERY existing row of the target
        statistic series, not just the requested range, and the
        re-import only repopulates the requested range. Use ONLY when
        re-running the whole year-to-date window (the default range); a
        window that starts after the end year's year-to-date start (Jan 1,
        or the contract start date if the entry bills from it) is rejected
        with clear on, unless the window ends on or before the current
        year-to-date start: the cost
        series is left out of both the wipe and the re-import there, so
        there is nothing to protect. For a narrower window, leave this off: the import upserts on
        (statistic_id, hour) so a re-run already overwrites the
        requested hours without touching anything outside the range.
      default: false
      selector:
        boolean:

