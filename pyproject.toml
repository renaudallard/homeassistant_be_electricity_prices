[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Collect from tests/ alone when no path is given. tmp/ holds scratch worktrees
# and one-off scripts, and pytest imports every *_test.py it finds there: a
# bare run once executed an old experiment that rewrote a live provider file.
testpaths = ["tests"]
# A parser regression that loops forever fails its test instead of hanging.
# The tests that lay out real cards with no text cached take longer, and say
# so with their own mark.
timeout = 60

[tool.mypy]
# custom_components/be_electricity_prices and tests/ would otherwise be
# resolved as both 'be_electricity_prices.*' and
# 'custom_components.be_electricity_prices.*' since neither directory
# carries an __init__.py at its root. explicit_package_bases tells mypy
# to treat each directory as its own package root, which matches how
# pytest collects them.
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pypdf",
    "pypdf.*",
    "pdfplumber",
    "pdfplumber.*",
    # pyxlsb (the Synergrid RLP workbook reader) ships no stubs either.
    "pyxlsb",
    "pyxlsb.*",
    # ocr_price_cards reads the cards published as page images. It runs in
    # the card-archive workflow only, never in an installation, so it is
    # absent here and mypy cannot see the py.typed it does ship.
    "ocr_price_cards",
    "ocr_price_cards.*",
    # pytest-homeassistant-custom-component ships without py.typed; mypy
    # would otherwise emit one 'missing library stubs' note per test file
    # that imports its MockConfigEntry.
    "pytest_homeassistant_custom_component",
    "pytest_homeassistant_custom_component.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# The rule set is spelled out so a ruff upgrade can never silently expand
# what is linted for. E501 is left to the formatter.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
# ruff 0.16 began formatting Python inside Markdown code fences. The docs
# hand-align example snippets for readability and 0.15 never reformatted
# them, so keep Markdown out of the formatter.
exclude = ["*.md"]
